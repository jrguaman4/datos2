<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Policía Ecuador - Login</title>
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="login-body">

<header class="topbar">
    <div class="logo">POLICÍA ECUADOR</div>
</header>

<div class="login-container">
    <button class="login-btn" onclick="login()">
        INICIAR SESIÓN
    </button>

    <div class="mission">
        <h2>Misión</h2>
        <p>
            Atender la seguridad ciudadana y el orden público,
            y proteger el libre ejercicio de los derechos y la seguridad
            de las personas dentro del territorio nacional.
        </p>
    </div>
</div>

<script src="assets/js/auth.js"></script>
</body>
</html>
